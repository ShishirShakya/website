# Pushes the MyST build to the user Pages repo so the site is served at
# https://shishirshakya.github.io/ (not /website/). Requires a repository secret
# GH_PAGES_DEPLOY_TOKEN: a fine-grained PAT with Contents: Read and write on
# ShishirShakya/ShishirShakya.github.io (Classic PAT: repo scope is fine).
name: deploy

on:
  push:
    branches:
      - main

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 18.x

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MyST Markdown
        run: npm install -g mystmd

      # For apex GitHub user Pages (shishirshakya.github.io/) do not set BASE_URL; see
      # https://mystmd.org/guide/deployment (root URL does not use a subfolder base).
      - name: Build HTML Assets
        run: myst build --html

      # MyST static HTML writes http://localhost:3000 into robots.txt and sitemap.xml
      # (jupyter-book/mystmd#2695). Rewrite to the apex user Pages origin. Do not set BASE_URL.
      - name: Rewrite MyST localhost URLs
        run: python scripts/rewrite_myst_localhost_urls.py

      - name: Add canonical URLs and JSON-LD
        run: python scripts/postprocess_html_seo.py

      # Direct download URLs (not in TOC), e.g. /files/MessyData.xlsx
      # Self-hosted fonts referenced from custom.css at /fonts/...
      - name: Copy static download files and fonts
        run: |
          cp -r files _build/html/files
          cp files/404.html _build/html/404.html
          shopt -s nullglob
          for f in files/google*.html; do cp "$f" _build/html/; done
          cp -r fonts _build/html/fonts

      # If a push is "denied to github-actions[bot]", GH_PAGES_DEPLOY_TOKEN was
      # empty; GITHUB_TOKEN cannot push to another repository.
      - name: Check deploy secret is set
        env:
          DEPLOY_PAT: ${{ secrets.GH_PAGES_DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_PAT" ]; then
            echo "::error::Set repository secret GH_PAGES_DEPLOY_TOKEN to a PAT with Contents: write on ShishirShakya.github.io"
            exit 1
          fi

      # The user Pages repo still uses branch `master` for the live site; `main` had
      # the MyST build but Pages was not serving it. Overwrite `master` so the apex URL updates.
      - name: Deploy to shishirshakya.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAGES_DEPLOY_TOKEN }}
          publish_dir: _build/html
          publish_branch: master
          external_repository: ShishirShakya/ShishirShakya.github.io
          force_orphan: true
