# PR checks: MyST build + generated publications check. (Netlify PR preview is
# disabled; enable the commented step and set NETLIFY_* secrets to use it.)
name: build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  build-the-book:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 18.x

      - name: Install MyST Markdown
        run: npm install -g mystmd

      - name: Build HTML Assets
        run: myst build --html

      # MyST writes http://localhost:3000 into robots.txt and sitemap.xml (mystmd#2695).
      # Rewrite to the apex user Pages origin. Do not set BASE_URL.
      - name: Rewrite MyST localhost URLs
        run: |
          for f in _build/html/robots.txt _build/html/sitemap.xml _build/html/sitemap_style.xsl; do
            if [ -f "$f" ]; then
              sed -i 's|http://localhost:3000|https://shishirshakya.github.io|g' "$f"
            fi
          done
          if grep -q 'http://localhost:3000' _build/html/robots.txt _build/html/sitemap.xml; then
            echo "localhost URLs remain in sitemap or robots.txt"
            exit 1
          fi

      # Direct download URLs (not in TOC), e.g. /files/MessyData.xlsx
      # Self-hosted fonts referenced from custom.css at /fonts/...
      # Joined Grain of Salt Readings at /audio/*.mp3
      # 404.html at site root for GitHub Pages. Optional google*.html for Search Console.
      - name: Copy static download files and fonts
        run: |
          cp -r files _build/html/files
          test -f _build/html/files/MessyData.xlsx
          cp files/404.html _build/html/404.html
          cp files/headshot.webp _build/html/files/headshot.webp
          shopt -s nullglob
          for f in files/google*.html; do cp "$f" _build/html/; done
          cp -r fonts _build/html/fonts
          test -f _build/html/fonts/archivo-latin-400-normal.woff2
          test -f _build/html/fonts/source-serif-4-latin-400-normal.woff2
          mkdir -p _build/html/audio
          cp audio/*.mp3 _build/html/audio/
          test -f _build/html/audio/2026-09-12-stop-policing-ai-use.mp3

