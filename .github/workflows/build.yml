# PR checks: MyST build + generated publications check. (Netlify PR preview is
# disabled; enable the commented step and set NETLIFY_* secrets to use it.)
name: build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  build-the-book:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 18.x

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MyST Markdown
        run: npm install -g mystmd

      - name: Check generated publication pages
        run: python scripts/generate_publications_md.py --check

      - name: Build HTML Assets
        run: myst build --html

      # MyST static HTML writes http://localhost:3000 into robots.txt and sitemap.xml
      # (jupyter-book/mystmd#2695). Rewrite to the apex user Pages origin. Do not set BASE_URL.
      - name: Rewrite MyST localhost URLs
        run: python scripts/rewrite_myst_localhost_urls.py

      - name: Add canonical URLs and JSON-LD
        run: python scripts/postprocess_html_seo.py

      # Direct download URLs (not in TOC), e.g. /files/MessyData.xlsx
      # Self-hosted fonts referenced from custom.css at /fonts/...
      # 404.html at site root for GitHub Pages. Optional google*.html for Search Console.
      - name: Copy static download files and fonts
        run: |
          cp -r files _build/html/files
          test -f _build/html/files/MessyData.xlsx
          cp files/404.html _build/html/404.html
          cp files/headshot.webp _build/html/files/headshot.webp
          shopt -s nullglob
          for f in files/google*.html; do cp "$f" _build/html/; done
          cp -r fonts _build/html/fonts
          test -f _build/html/fonts/archivo-latin-400-normal.woff2
          test -f _build/html/fonts/source-serif-4-latin-400-normal.woff2

